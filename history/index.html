<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Настоящая история задач: как агенты вели приложение SmokeLess от идеи до финального дизайна. Гейты, остановки, время и расход.">
<meta property="og:title" content="История SmokeLess">
<meta property="og:description" content="Настоящая история задач: как агенты вели приложение SmokeLess от идеи до финального дизайна. Гейты, остановки, время и расход.">
<title>История SmokeLess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticky vertical rail of stages on the left; on the right one scene per stage: swimlanes of actors, time runs down, a gate card closes the stage. */
:root{
  --bg:#f7f7f8; --panel:#ffffff; --ink:#1a1c20; --muted:#6a6f7a; --line:#e3e5ea; --tint:#f1f2fb;
  --accent:#5560cf; --owner:#b4690e; --owner-bg:#fdf1dc; --ok:#1f8f5f; --repo:#7a52c7; --bad:#c0392f;
  --r-owner:#b4690e; --r-lead:#5560cf; --r-res:#0f8a7e; --r-idea:#c2417f; --r-po:#2f7fd1; --r-arch:#5f6b7a; --r-repo:#7a52c7; --r-pa:#8a5a2b; --r-mk:#cf5a1e; --r-copy:#7b7f16; --r-pd:#0b86a6; --r-vd:#a945c9; --r-dr:#c6453f; --r-ux:#2f9a4f;
  --display:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e0f11; --panel:#15171a; --ink:#e7e8eb; --muted:#8a8f99; --line:#272a30; --tint:#1b1d2b;
    --accent:#8e97f2; --owner:#f0b257; --owner-bg:#3a2a10; --ok:#4cc38a; --repo:#b393f0; --bad:#ff8f86;
    --r-owner:#f0b257; --r-lead:#8e97f2; --r-res:#4fd0c2; --r-idea:#f08cba; --r-po:#74b4f5; --r-arch:#a3adba; --r-repo:#b393f0; --r-pa:#d9a877; --r-mk:#f59a66; --r-copy:#cfd45a; --r-pd:#5cc8e6; --r-vd:#d79af0; --r-dr:#f58d86; --r-ux:#73d590;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0f11; --panel:#15171a; --ink:#e7e8eb; --muted:#8a8f99; --line:#272a30; --tint:#1b1d2b;
  --accent:#8e97f2; --owner:#f0b257; --owner-bg:#3a2a10; --ok:#4cc38a; --repo:#b393f0; --bad:#ff8f86;
    --r-owner:#f0b257; --r-lead:#8e97f2; --r-res:#4fd0c2; --r-idea:#f08cba; --r-po:#74b4f5; --r-arch:#a3adba; --r-repo:#b393f0; --r-pa:#d9a877; --r-mk:#f59a66; --r-copy:#cfd45a; --r-pd:#5cc8e6; --r-vd:#d79af0; --r-dr:#f58d86; --r-ux:#73d590;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:28px 20px 80px}
header{margin:0 0 22px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:26px;line-height:1.2;font-weight:600;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:62ch}
.about{margin:6px 0 10px;max-width:66ch}
.about b{font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:500}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr) 176px;gap:28px;align-items:start}
/* rail */
.railwrap{position:sticky;top:16px}
.burger{display:none;flex:none;width:36px;height:32px;padding:0;align-items:center;justify-content:center;font-size:18px;line-height:1}
.rail{list-style:none;margin:0;padding:6px 0 6px 0}
.ctl{position:sticky;top:16px;display:flex;flex-direction:column;gap:8px}
.ctl button{width:100%;text-align:left}
.ctl .back{position:static;order:-1;box-shadow:none;border-radius:6px;justify-content:center;width:100%}
.rail li{position:relative;padding:0 0 0 30px;font-size:13.5px;color:var(--muted);transition:color .3s}
.rail button{all:unset;display:block;width:100%;padding:7px 8px 8px 0;cursor:pointer;border-radius:6px}
.rail button:hover{color:var(--ink)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rail li em{display:block;font-style:normal;font-weight:400;font-size:12px;line-height:1.35;color:var(--muted);margin-top:1px}
.rail li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--line)}
.rail li:first-child::before{top:14px}.rail li:last-child::before{bottom:calc(100% - 14px)}
.rail li::after{content:"";position:absolute;left:5px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.5px solid var(--muted);transition:all .3s}
.rail li.gate::after{border-radius:2px;transform:rotate(45deg);width:9px;height:9px;left:6px;top:12px;border-color:var(--owner)}
.rail li.gate{color:var(--owner)}
.rail li small{font-size:11px;color:var(--muted);font-family:var(--mono);font-weight:400;margin-left:6px}
.rail li.on{color:var(--ink);font-weight:600}
.rail li.on::after{border-color:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.rail li.gate.on::after{border-color:var(--owner);box-shadow:0 0 0 4px var(--owner-bg)}
.rail li.done::after{background:var(--ok);border-color:var(--ok)}
.rail li.done{color:var(--ink)}
/* scene */
.scene{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto;margin:0 0 28px}
.inner{min-width:660px}
.shead{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.shead .k{font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px}
.shead h2{font-size:19px;font-weight:600;margin:0}
.shead p{margin:0;color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:72px minmax(0,1fr) 290px}
.roles{display:flex;flex-wrap:wrap;gap:6px 8px;padding:12px 22px;border-bottom:1px solid var(--line)}
.role{--c:var(--accent);display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px 3px 4px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.av{--c:var(--accent);width:22px;height:22px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--c);color:var(--panel)}
.av svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.role .av{width:18px;height:18px}.role .av svg{width:11px;height:11px}
.row{border-bottom:1px solid var(--line);transition:opacity .4s,background .4s}
.row .tag{font-family:var(--mono);font-size:11px;color:var(--muted);padding:16px 0 0 12px}
.row .area{padding:12px 14px 12px 6px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.row .note{padding:12px 18px 12px 16px;font-size:13px;line-height:1.4;border-left:1px solid var(--line)}
.row .note b{display:block;font-weight:600;margin-bottom:2px}
.row .note span{color:var(--muted)}
.row.idle{opacity:.3}
.row.active{background:var(--tint)}
.row.active .note span{color:var(--ink)}
.hop{display:flex;align-items:center;gap:8px;min-height:42px}
.from{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;transition:opacity .5s}
.from .av{width:18px;height:18px;opacity:.75}.from .av svg{width:11px;height:11px}
.arr{transition:opacity .4s}
.bub{--c:var(--accent);display:inline-flex;align-items:center;gap:9px;padding:5px 14px 5px 6px;border-radius:22px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--panel));transition:border-color .35s,background-color .35s;white-space:nowrap;will-change:transform}
.bub .avw{display:inline-flex}
.arr{position:relative;width:26px;height:10px;flex:none}
.arr i{position:absolute;left:0;right:3px;top:4.25px;height:1.5px;background:var(--muted);transform-origin:left center;border-radius:1px}
.arr::after{content:"";position:absolute;right:1px;top:1.5px;width:6px;height:6px;border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);transform:rotate(45deg)}
.shead{cursor:pointer}
.shead:hover h2{color:var(--accent)}
.shead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.meta span{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
.hop{position:relative}
.curse{position:absolute;left:0;top:-15px;z-index:4;background:var(--ink);color:var(--panel);font-family:var(--mono);font-weight:500;font-size:12px;line-height:1;padding:5px 9px;border-radius:10px 10px 10px 2px;white-space:nowrap;opacity:0;pointer-events:none;transform-origin:left bottom}
.row.nudge .tag{color:var(--owner);font-weight:500}
.row.nudge .note b{color:var(--owner)}
.row.nudge .bub{border-style:dashed}
.row.stop{background:color-mix(in srgb,var(--bad) 7%,var(--panel))}
.row.stop .tag{color:var(--bad);font-weight:500}
.row.stop .note b{color:var(--bad)}
.row.stop.active{background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.gcard h3{cursor:pointer}
.bub .av{width:28px;height:28px;transition:background-color .45s}.bub .av svg{width:16px;height:16px}
.bub .tx{display:flex;flex-direction:column;line-height:1.2}
.bub .tx small{font-size:11px;color:var(--c);font-weight:600;transition:color .45s}
.bub .tx b{font-size:13.5px;font-weight:500}
.bub.file .tx b{font-family:var(--mono);font-size:12.5px}
.bub .st{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c);margin-left:2px;flex:none}
.bub.done .st{background:var(--ok);border-color:var(--ok)}
.row.pre .from,.row.pre .arr{opacity:0}
/* gate */
.gcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;padding:20px 22px 22px;background:var(--panel);transition:opacity .4s}
.gcard.idle{opacity:.3}
.gcard h3{font-size:15px;font-weight:600;margin:0 0 8px;color:var(--owner)}
.gcard ul{margin:0;padding:0;list-style:none;font-size:13px}
.gcard li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.gcard li code{font-family:var(--mono);font-size:12px;min-width:118px;color:var(--repo)}
.gcard li span{color:var(--muted)}
.cbox{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:12px}
.cbox .who{font-size:12px;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.cbox .who i{width:20px;height:20px;border-radius:50%;background:var(--owner);color:var(--panel);font-style:normal;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.field{font-family:var(--mono);font-size:14px;min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);display:flex;align-items:center}
.field.focus{border-color:var(--owner);box-shadow:0 0 0 3px var(--owner-bg)}
.caret{display:inline-block;width:1.5px;height:17px;background:var(--ink);margin-left:1px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.send{margin-top:8px;display:flex;justify-content:flex-end}
.send span{font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:6px;background:var(--line);color:var(--muted);transition:all .25s}
.send span.go{background:var(--owner);color:var(--panel)}
.after{list-style:none;margin:12px 0 0;padding:0;font-size:13px}
.after li{display:flex;gap:9px;align-items:baseline;padding:4px 0;opacity:0;transform:translateY(4px);transition:all .4s}
.after li.show{opacity:1;transform:none}
.after li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;position:relative;top:-1px}
.after code{font-family:var(--mono);font-size:12px}
.stub{padding:18px 22px 22px;color:var(--muted);font-size:13.5px}
.stub ol{margin:8px 0 0;padding-left:20px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);padding:12px 22px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1.5px solid var(--accent)}
@media (max-width:1100px){
  .wrap{padding:14px 12px 60px}
  .layout{grid-template-columns:minmax(0,1fr);gap:12px}
  .railwrap{position:sticky;top:0;z-index:7;display:flex;align-items:center;gap:8px;background:var(--bg);margin:0 -12px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .burger{display:inline-flex}
  .rail{flex:1;min-width:0;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:0;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail li{padding:0;flex:none} .rail li::before,.rail li::after{display:none}
  .rail button{padding:5px 11px;border:1px solid var(--line);border-radius:14px;font-size:12.5px;white-space:nowrap;width:auto;background:var(--panel)}
  .rail li em,.rail li small{display:none}
  .rail li.on button{border-color:var(--accent);background:var(--tint)}
  .rail li.gate.on button{border-color:var(--owner);background:var(--owner-bg)}
  .rail li.done button{color:var(--ink)}
  .scene{scroll-margin-top:56px;margin-bottom:16px}
  .ctl{position:absolute;left:0;right:0;top:100%;z-index:6;display:none;grid-template-columns:1fr 1fr;gap:8px;padding:12px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 8px 18px rgba(0,0,0,.14)}
  .ctl.open{display:grid}
  .ctl button{text-align:center}
}
@media (max-width:860px){
  h1{font-size:21px} header{margin-bottom:12px}
  .inner{min-width:0}
  .shead{padding:14px 14px 12px;gap:8px 12px} .shead h2{font-size:17px}
  .roles{padding:10px 14px}
  .grid{grid-template-columns:58px minmax(0,1fr)}
  .row .tag{padding:14px 0 0 8px;font-size:10.5px}
  .row .area{padding:12px 12px 8px 4px}
  .row .note{grid-column:1 / -1;border-left:0;padding:0 14px 12px 62px}
  .hop{flex-direction:column;align-items:flex-start;gap:4px;min-height:0}
  .arr{display:none}
  .bub{white-space:normal;max-width:100%}
  .gcard{grid-template-columns:minmax(0,1fr);padding:16px 14px}
  .gcard li code{min-width:0;flex:none;max-width:45%}
  .field{font-size:13px}
  .nogate{padding:12px 14px}
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){.bub,.from,.arr,.row,.after li{transition:none}.caret{animation:none}}

.scene{scroll-margin-top:12px}
.toplegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);margin:0 0 16px}
.toplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1.5px solid var(--accent)}
.nogate{padding:14px 22px;font-size:13px;color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 18px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.sum b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--muted)}
.back{position:fixed;right:16px;bottom:16px;z-index:20;display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:22px;border:0;background:var(--accent);color:var(--panel);font-weight:500;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer}
.back.show{display:inline-flex}
.back:hover{border:0;filter:brightness(1.08)}
.back i{width:8px;height:8px;border-radius:50%;background:var(--panel);animation:bl 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.back i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="h-title"></h1>
      <p class="about" id="h-about"></p>
      <p class="lead" id="h-lead"></p>
    </div>
  </header>
  <div class="layout">
    <div class="railwrap" id="railwrap"><button id="burger" class="burger" type="button" aria-expanded="false" aria-controls="ctl" aria-label="Управление анимацией">≡</button><ol class="rail" id="rail"></ol></div>
    <div>
      <div class="toplegend"><span><i></i>задача в работе</span><span><i style="background:var(--ok);border-color:var(--ok)"></i>задача done или файл в репозитории</span><span>Слева от плашки видно, от кого пришла задача</span></div>
      <div class="sum" id="sum"></div>
      <div id="scenes"></div>
    </div>
    <aside class="ctl" id="ctl" aria-label="Управление анимацией">
      <button class="primary" id="play" type="button">Пауза</button>
      <button id="restart" type="button">Сначала</button>
      <button id="follow" type="button" aria-pressed="true">Следить за шагом: да</button>
      <button id="speed" type="button" aria-label="Скорость анимации">Скорость: ×1</button>
      <button id="theme" type="button">Тема: авто</button>
    </aside>
  </div>
</div>

<script>

    try{if(Math.abs(se.scrollTop-top)>4&&se.scrollHeight<=se.clientHeight+4)el.scrollIntoView({behavior:smooth?'smooth':'auto',block:blk==='start'?'start':'center'});}catch(e){}}
  function setBub(m,k){m.bub.style.setProperty('--c',col(k));m.avEl.innerHTML=av(k);m.nm.textContent=ROLE[k][0];}
  function railItem(k,name,code,short,gate,si,atGate){
    ORDER.push(k);
    var li=document.createElement('li');li.setAttribute('data-k',k);if(gate)li.className='gate';
    var b=document.createElement('button');b.type='button';b.innerHTML=name+'<small>'+code+'</small><em>'+short+'</em>';li.appendChild(b);railEl.appendChild(li);rail[k]=li;
    b.addEventListener('click',function(e){e.preventDefault();jump(si,atGate);});
  }
  SC.forEach(function(s,si){
    railItem(s.k,s.rail||s.title,s.code,s.short,false,si,false);
    var sec=document.createElement('section');sec.className='scene';sec.id='st-'+s.k;
    var used=[];s.rows.forEach(function(r){r[1].forEach(function(m){[m[0],m[1]].forEach(function(k){if(used.indexOf(k)<0)used.push(k);});});});
    var h='<div class="inner"><div class="shead" tabindex="0" role="button" aria-label="Запустить анимацию с этого этапа"><span class="k">'+s.n+'</span><h2></h2><p></p>'+(s.meta?'<div class="meta">'+s.meta.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>':'')+'</div><div class="roles">'+used.map(function(k){return '<span class="role">'+av(k)+ROLE[k][0]+'</span>';}).join('')+'</div><div class="rws"></div>';
    if(s.gate){var g=s.gate;h+='<div class="gcard"><div><h3>'+g.name+': '+(g.head||'что видит владелец')+'</h3><ul>'+g.pack.map(function(p){return '<li><code>'+p[0]+'</code><span>'+p[1]+'</span></li>';}).join('')+'</ul></div><div><div class="cbox"><p class="who"><i>В</i>'+(DATA.gateWho||'Владелец отвечает в задаче инициативы')+'</p><div class="field"><span class="typed"></span></div><div class="send"><span>Отправить</span></div></div><ul class="after">'+g.after.map(function(a){return '<li>'+a+'</li>';}).join('')+'</ul></div></div>';}
    else h+='<div class="nogate">'+(s.end||'Гейта здесь нет. Лидер принимает работу и сам запускает следующий этап.')+'</div>';
    sec.innerHTML=h+'</div>';sec.querySelector('h2').textContent=s.title;sec.querySelector('.shead p').textContent=s.sub;
    var rws=sec.querySelector('.rws');s.R=[];
    s.rows.forEach(function(r){
      var row=document.createElement('div');var base='grid row'+(r[4]==='stop'?' stop':r[4]==='nudge'?' nudge':'');row.className=base;
      var tag=document.createElement('div');tag.className='tag';tag.textContent=r[0];
      var area=document.createElement('div');area.className='area';var mvs=[];
      r[1].forEach(function(m){
        var hop=document.createElement('div');hop.className='hop';var self=m[0]===m[1];
        var from=document.createElement('span');from.className='from';from.innerHTML=av(m[0])+ROLE[m[0]][0];
        var arr=document.createElement('span');arr.className='arr';arr.innerHTML='<i></i>';
        var bub=document.createElement('span');bub.className='bub'+(isRepo(m[1])?' file':'');
        bub.innerHTML='<span class="avw"></span><span class="tx"><small></small><b></b></span><span class="st"></span>';bub.querySelector('b').textContent=m[2];
        if(!self){hop.appendChild(from);hop.appendChild(arr);}hop.appendChild(bub);area.appendChild(hop);
        var o={a:m[0],b:m[1],self:self,bub:bub,from:from,line:arr.firstChild,avEl:bub.querySelector('.avw'),nm:bub.querySelector('small'),done:isRepo(m[1])};setBub(o,o.b);mvs.push(o);
      });
      var note=document.createElement('div');note.className='note';note.innerHTML='<b></b><span></span>';note.firstChild.textContent=r[2];note.lastChild.textContent=r[3];
      row.appendChild(tag);row.appendChild(area);row.appendChild(note);rws.appendChild(row);s.R.push({el:row,mvs:mvs,base:base});
    });
    s.el=sec;
    (function(si){var hd=sec.querySelector('.shead');function st(){jump(si,false);}hd.addEventListener('click',st);hd.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();st();}});var g3=sec.querySelector('.gcard h3');if(g3)g3.addEventListener('click',function(){jump(si,true);});})(si);
    if(s.gate){s.G={card:sec.querySelector('.gcard'),typed:sec.querySelector('.typed'),field:sec.querySelector('.field'),send:sec.querySelector('.send span'),after:[].slice.call(sec.querySelectorAll('.after li'))};railItem(s.gate.k,s.gate.name,s.gate.code,s.gate.short,true,si,true);}
    scenesEl.appendChild(sec);
  });
  function jump(si,atGate){var s=SC[si];setFollow(true);gen++;playing=true;started=true;label();railSet(atGate&&s.gate?s.gate.k:s.k);go(atGate&&s.G?s.G.card:s.el,'start',false);run(gen,si,atGate);}
  function railSet(on){var i=ORDER.indexOf(on);ORDER.forEach(function(k,j){rail[k].classList.toggle('on',j===i);rail[k].classList.toggle('done',j<i);});
    var li=rail[on];if(li&&railEl.scrollWidth>railEl.clientWidth+4){try{railEl.scrollTo({left:li.offsetLeft-railEl.clientWidth/2+li.offsetWidth/2,behavior:reduce?'auto':'smooth'});}catch(e){railEl.scrollLeft=li.offsetLeft;}}}
  function rowRest(r){r.el.className=r.base;r.mvs.forEach(function(m){m.bub.style.transform='none';if(m.line)m.line.style.transform='';setBub(m,m.b);m.bub.classList.toggle('done',m.done);});}
  function rowArm(r){r.el.className=r.base+' idle pre';r.mvs.forEach(function(m){m.bub.style.transform='none';setBub(m,m.a);m.bub.classList.remove('done');if(!m.self&&m.line)m.line.style.transform='scaleX(0)';});}
  function gateRest(s){if(!s.G)return;s.G.card.classList.remove('idle');s.G.typed.textContent=s.gate.text;s.G.field.classList.remove('focus');s.G.send.classList.remove('go');s.G.after.forEach(function(a){a.classList.add('show');});}
  function gateArm(s){if(!s.G)return;s.G.card.classList.add('idle');s.G.typed.textContent='';s.G.field.classList.remove('focus');s.G.send.classList.remove('go');s.G.after.forEach(function(a){a.classList.remove('show');});}
  function restAll(){SC.forEach(function(s){s.R.forEach(rowRest);gateRest(s);});railSet(SC[0].k);}
  function wait(ms,my){return new Promise(function(res){var left=reduce?0:ms/speed;(function tick(){if(my!==gen){res();return;}if(!playing){setTimeout(tick,120);return;}if(left<=0){res();return;}left-=60;setTimeout(tick,60);})();});}
  function anim(el,kf,opt){try{if(el&&el.animate&&!reduce){if(opt.duration)opt.duration=opt.duration/speed;if(opt.delay)opt.delay=opt.delay/speed;return el.animate(kf,opt);}}catch(e){}return null;}
  function fly(m){
    var ring=[{boxShadow:'0 0 0 0 color-mix(in srgb,'+col(m.b)+' 60%,transparent)'},{boxShadow:'0 0 0 14px color-mix(in srgb,'+col(m.b)+' 0%,transparent)'}];
    if(m.self){m.bub.style.transform='none';anim(m.bub,[{transform:'scale(.9)'},{transform:'scale(1.06)',offset:.6},{transform:'scale(1)'}],{duration:520,easing:'ease-out'});anim(m.bub,ring,{duration:700,delay:300});return;}
    var dx=m.from.offsetLeft-m.bub.offsetLeft,dy=m.from.offsetTop-m.bub.offsetTop+(m.from.offsetHeight-m.bub.offsetHeight)/2,lift=Math.abs(dx)>20?-16:0,side=Math.abs(dx)>20?0:14;
    m.bub.style.transform='none';
    anim(m.from,[{transform:'scale(1)'},{transform:'scale(1.14)',offset:.4},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});
    anim(m.bub,[{transform:'translate('+dx+'px,'+dy+'px) scale(.9) rotate(0deg)'},{transform:'translate('+(dx*.5+side)+'px,'+(dy*.5+lift)+'px) scale(1.07) rotate('+(lift?-3:0)+'deg)',offset:.55},{transform:'translate(0,0) scale(1) rotate(0deg)'}],{duration:950,easing:'cubic-bezier(.34,.72,.24,1)'});
    if(m.line){m.line.style.transform='';anim(m.line,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:700,easing:'ease-out'});}
    setTimeout(function(){anim(m.avEl,[{transform:'rotateY(0deg)'},{transform:'rotateY(90deg)',offset:.5},{transform:'rotateY(0deg)'}],{duration:360,easing:'ease-in-out'});setTimeout(function(){setBub(m,m.b);},reduce?0:180/speed);},reduce?0:400/speed);
    anim(m.bub,ring,{duration:700,delay:880,easing:'ease-out'});
  }
  var CURSE=['Б#@^!','П@&#$!!','Ё#%&!','Ну #&@%!','@#$%!!','Да ё#@&!','Х@#$%!'],curseI=0;
  function curse(m){var hop=m.bub.parentNode,c=hop.querySelector('.curse');if(!c){c=document.createElement('span');c.className='curse';c.setAttribute('aria-hidden','true');hop.appendChild(c);}c.textContent=CURSE[curseI++%CURSE.length];
    anim(c,[{opacity:0,transform:'scale(.3) rotate(-12deg)'},{opacity:1,transform:'scale(1.25) rotate(4deg)',offset:.12},{opacity:1,transform:'scale(1) rotate(-3deg)',offset:.2},{opacity:1,transform:'scale(1.06) rotate(3deg)',offset:.3},{opacity:1,transform:'scale(1) rotate(-2deg)',offset:.4},{opacity:1,transform:'scale(1) rotate(0)',offset:.85},{opacity:0,transform:'scale(.9) translateY(-8px)'}],{duration:2600,easing:'ease-out'});}
  function playRow(s,i,my){var r=s.R[i];
    if(i>0)s.R[i-1].el.className=s.R[i-1].base;
    r.el.className=r.base+' active pre';curEl=r.el;backVis();see(r.el);
    return wait(650,my).then(function(){if(my!==gen)return;r.el.classList.remove('pre');if(r.base.indexOf('nudge')>=0&&r.mvs.length)curse(r.mvs[0]);r.mvs.forEach(function(m,k){setTimeout(function(){if(my===gen)fly(m);},reduce?0:k*220/speed);});return wait(1250+(r.mvs.length-1)*220,my);})
     .then(function(){if(my!==gen)return;r.mvs.forEach(function(m){setBub(m,m.b);if(m.done)m.bub.classList.add('done');if(r.base.indexOf('nudge')>=0)anim(m.bub,[{transform:'rotate(0)'},{transform:'rotate(-5deg) translateX(-4px)'},{transform:'rotate(5deg) translateX(4px)'},{transform:'rotate(-4deg) translateX(-3px)'},{transform:'rotate(4deg) translateX(3px)'},{transform:'rotate(0)'}],{duration:560,easing:'ease-in-out'});});return wait(2700,my);});
  }
  function playGate(s,my){var G=s.G,T=s.gate.text;
    var p=Promise.resolve().then(function(){if(my!==gen)return;G.card.classList.remove('idle');animSet(s.gate.k);curEl=G.card;backVis();see(G.card);G.field.classList.add('focus');G.typed.innerHTML='<span class="caret"></span>';return wait(900,my);});
    T.split('').forEach(function(ch,i){p=p.then(function(){if(my!==gen)return;G.typed.innerHTML=T.slice(0,i+1).replace(/</g,'&lt;')+'<span class="caret"></span>';return wait(85,my);});});
    return p.then(function(){if(my!==gen)return;G.send.classList.add('go');return wait(900,my);})
     .then(function(){if(my!==gen)return;G.typed.textContent=T;G.field.classList.remove('focus');G.send.classList.remove('go');G.after[0].classList.add('show');return wait(1100,my);})
     .then(function(){if(my!==gen)return;G.after[1].classList.add('show');return wait(1100,my);})
     .then(function(){if(my!==gen)return;G.after[2].classList.add('show');return wait(2200,my);});
  }
  function run(my,from,atGate){
    from=from||0;
    SC.forEach(function(s,si){if(si<from||(si===from&&atGate)){s.R.forEach(rowRest);if(si<from)gateRest(s);else gateArm(s);}else{s.R.forEach(rowArm);gateArm(s);}});
    var p=Promise.resolve();
    SC.forEach(function(s,si){if(si<from)return;
      var skipRows=(si===from&&atGate);
      p=p.then(function(){if(my!==gen)return;animSet(s.k);if(!skipRows){see(s.el,'start');return wait(1100,my);}});
      if(!skipRows)s.R.forEach(function(r,i){p=p.then(function(){if(my!==gen)return;return playRow(s,i,my);});});
      p=p.then(function(){if(my!==gen)return;s.R[s.R.length-1].el.className=s.R[s.R.length-1].base;});
      if(s.G)p=p.then(function(){if(my!==gen)return;return playGate(s,my);});
      else p=p.then(function(){if(my!==gen)return;return wait(1200,my);});
    });
    return p.then(function(){if(my!==gen)return;return wait(6000,my);}).then(function(){if(my!==gen)return;run(my,0,false);});
  }
  bFollow.addEventListener('click',function(){setFollow(!follow);});
  var bSpeed=document.getElementById('speed'),SP=[1,2,4],spi=0;
  bSpeed.addEventListener('click',function(){spi=(spi+1)%SP.length;speed=SP[spi];bSpeed.textContent='Скорость: ×'+speed;});
  var bTheme=document.getElementById('theme'),root=document.documentElement,hostTheme=root.getAttribute('data-theme'),TH=['auto','light','dark'],TN={auto:'авто',light:'светлая',dark:'тёмная'},ti=0;
  try{var sv=localStorage.getItem('flow-theme');if(sv&&TH.indexOf(sv)>=0)ti=TH.indexOf(sv);}catch(e){}
  function applyTheme(){var v=TH[ti];if(v==='auto'){if(hostTheme)root.setAttribute('data-theme',hostTheme);else root.removeAttribute('data-theme');}else root.setAttribute('data-theme',v);bTheme.textContent='Тема: '+TN[v];}
  bTheme.addEventListener('click',function(){ti=(ti+1)%3;applyTheme();try{localStorage.setItem('flow-theme',TH[ti]);}catch(e){}});
  applyTheme();
  ['wheel','touchmove'].forEach(function(e){window.addEventListener(e,function(){if(follow)setFollow(false);},{passive:true});});
  window.addEventListener('keydown',function(e){if(follow&&['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].indexOf(e.key)>=0&&e.target.tagName!=='BUTTON')setFollow(false);});
  bPlay.addEventListener('click',function(){playing=!playing;label();if(playing&&!started){started=true;run(gen,0,false);}});
  document.getElementById('restart').addEventListener('click',function(){setFollow(true);gen++;playing=true;started=true;label();run(gen,0,false);});
  var SUM=DATA.summary||[];var sm=document.getElementById('sum');if(sm)SUM.forEach(function(x){var d=document.createElement('div');d.innerHTML='<b></b><span></span>';d.firstChild.textContent=x[0];d.lastChild.textContent=x[1];sm.appendChild(d);});
  label();restAll();
  if(!reduce){var g0=gen;setTimeout(function(){if(gen===g0&&!started){started=true;run(gen,0,false);}},1600);}
})();
</script>
