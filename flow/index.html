<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Как студия агентов ведёт продукт от идеи до дизайна: шесть этапов, четыре гейта, кто кому передаёт задачу.">
<meta property="og:title" content="Флоу студии по этапам">
<meta property="og:description" content="Как студия агентов ведёт продукт от идеи до дизайна: шесть этапов, четыре гейта, кто кому передаёт задачу.">
<title>Флоу студии по этапам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticky vertical rail of stages on the left; on the right one scene per stage: swimlanes of actors, time runs down, a gate card closes the stage. */
:root{
  --bg:#f7f7f8; --panel:#ffffff; --ink:#1a1c20; --muted:#6a6f7a; --line:#e3e5ea; --tint:#f1f2fb;
  --accent:#5560cf; --owner:#b4690e; --owner-bg:#fdf1dc; --ok:#1f8f5f; --repo:#7a52c7; --bad:#c0392f;
  --r-owner:#b4690e; --r-lead:#5560cf; --r-res:#0f8a7e; --r-idea:#c2417f; --r-po:#2f7fd1; --r-arch:#5f6b7a; --r-repo:#7a52c7; --r-pa:#8a5a2b; --r-mk:#cf5a1e; --r-copy:#7b7f16; --r-pd:#0b86a6; --r-vd:#a945c9; --r-dr:#c6453f; --r-ux:#2f9a4f;
  --display:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e0f11; --panel:#15171a; --ink:#e7e8eb; --muted:#8a8f99; --line:#272a30; --tint:#1b1d2b;
    --accent:#8e97f2; --owner:#f0b257; --owner-bg:#3a2a10; --ok:#4cc38a; --repo:#b393f0; --bad:#ff8f86;
    --r-owner:#f0b257; --r-lead:#8e97f2; --r-res:#4fd0c2; --r-idea:#f08cba; --r-po:#74b4f5; --r-arch:#a3adba; --r-repo:#b393f0; --r-pa:#d9a877; --r-mk:#f59a66; --r-copy:#cfd45a; --r-pd:#5cc8e6; --r-vd:#d79af0; --r-dr:#f58d86; --r-ux:#73d590;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0f11; --panel:#15171a; --ink:#e7e8eb; --muted:#8a8f99; --line:#272a30; --tint:#1b1d2b;
  --accent:#8e97f2; --owner:#f0b257; --owner-bg:#3a2a10; --ok:#4cc38a; --repo:#b393f0; --bad:#ff8f86;
    --r-owner:#f0b257; --r-lead:#8e97f2; --r-res:#4fd0c2; --r-idea:#f08cba; --r-po:#74b4f5; --r-arch:#a3adba; --r-repo:#b393f0; --r-pa:#d9a877; --r-mk:#f59a66; --r-copy:#cfd45a; --r-pd:#5cc8e6; --r-vd:#d79af0; --r-dr:#f58d86; --r-ux:#73d590;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:28px 20px 80px}
header{margin:0 0 22px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:26px;line-height:1.2;font-weight:600;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:62ch}
.about{margin:6px 0 10px;max-width:66ch}
.about b{font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:500}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr) 176px;gap:28px;align-items:start}
/* rail */
.railwrap{position:sticky;top:16px}
.burger{display:none;flex:none;width:36px;height:32px;padding:0;align-items:center;justify-content:center;font-size:18px;line-height:1}
.rail{list-style:none;margin:0;padding:6px 0 6px 0}
.ctl{position:sticky;top:16px;display:flex;flex-direction:column;gap:8px}
.ctl button{width:100%;text-align:left}
.ctl .back{position:static;order:-1;box-shadow:none;border-radius:6px;justify-content:center;width:100%}
.rail li{position:relative;padding:0 0 0 30px;font-size:13.5px;color:var(--muted);transition:color .3s}
.rail button{all:unset;display:block;width:100%;padding:7px 8px 8px 0;cursor:pointer;border-radius:6px}
.rail button:hover{color:var(--ink)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rail li em{display:block;font-style:normal;font-weight:400;font-size:12px;line-height:1.35;color:var(--muted);margin-top:1px}
.rail li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--line)}
.rail li:first-child::before{top:14px}.rail li:last-child::before{bottom:calc(100% - 14px)}
.rail li::after{content:"";position:absolute;left:5px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.5px solid var(--muted);transition:all .3s}
.rail li.gate::after{border-radius:2px;transform:rotate(45deg);width:9px;height:9px;left:6px;top:12px;border-color:var(--owner)}
.rail li.gate{color:var(--owner)}
.rail li small{font-size:11px;color:var(--muted);font-family:var(--mono);font-weight:400;margin-left:6px}
.rail li.on{color:var(--ink);font-weight:600}
.rail li.on::after{border-color:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.rail li.gate.on::after{border-color:var(--owner);box-shadow:0 0 0 4px var(--owner-bg)}
.rail li.done::after{background:var(--ok);border-color:var(--ok)}
.rail li.done{color:var(--ink)}
/* scene */
.scene{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto;margin:0 0 28px}
.inner{min-width:660px}
.shead{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.shead .k{font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px}
.shead h2{font-size:19px;font-weight:600;margin:0}
.shead p{margin:0;color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:72px minmax(0,1fr) 290px}
.roles{display:flex;flex-wrap:wrap;gap:6px 8px;padding:12px 22px;border-bottom:1px solid var(--line)}
.role{--c:var(--accent);display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px 3px 4px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.av{--c:var(--accent);width:22px;height:22px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--c);color:var(--panel)}
.av svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.role .av{width:18px;height:18px}.role .av svg{width:11px;height:11px}
.row{border-bottom:1px solid var(--line);transition:opacity .4s,background .4s}
.row .tag{font-family:var(--mono);font-size:11px;color:var(--muted);padding:16px 0 0 12px}
.row .area{padding:22px 14px 12px 6px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.row .note{padding:12px 18px 12px 16px;font-size:13px;line-height:1.4;border-left:1px solid var(--line)}
.row .note b{display:block;font-weight:600;margin-bottom:2px}
.row .note span{color:var(--muted)}
.row.idle{opacity:.3}
.row.active{background:var(--tint)}
.row.active .note span{color:var(--ink)}
.hop{display:flex;align-items:center;gap:8px;min-height:42px}
.from{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;transition:opacity .5s}
.from .av{width:18px;height:18px;opacity:.75}.from .av svg{width:11px;height:11px}
.arr{transition:opacity .4s}
.bub{--c:var(--accent);display:inline-flex;align-items:center;gap:9px;padding:5px 14px 5px 6px;border-radius:22px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--panel));transition:border-color .35s,background-color .35s;white-space:nowrap;will-change:transform}
.bub .avw{display:inline-flex}
.arr{position:relative;width:26px;height:10px;flex:none}
.arr i{position:absolute;left:0;right:3px;top:4.25px;height:1.5px;background:var(--muted);transform-origin:left center;border-radius:1px}
.arr::after{content:"";position:absolute;right:1px;top:1.5px;width:6px;height:6px;border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);transform:rotate(45deg)}
.shead{cursor:pointer}
.shead:hover h2{color:var(--accent)}
.shead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.meta span{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
.hop{position:relative}
.curse{position:absolute;left:0;top:-36px;max-width:92vw;z-index:4;background:var(--ink);color:var(--panel);font-family:var(--mono);font-weight:600;font-size:16px;line-height:1;padding:8px 13px;border-radius:13px 13px 13px 2px;box-shadow:0 4px 12px rgba(0,0,0,.22);white-space:nowrap;opacity:0;pointer-events:none;transform-origin:left bottom}
.term{margin:2px 0 0;border-radius:8px;background:#14171c;color:#d7dbe2;font-family:var(--mono);font-size:12px;line-height:1.55;overflow:hidden;border:1px solid #2a2f37}
.term .th{display:flex;align-items:center;gap:6px;padding:5px 10px;background:#1c2027;color:#8b93a1;font-size:11px}
.term .th i{width:8px;height:8px;border-radius:50%;background:#3a414c}
.term pre{margin:0;padding:9px 12px 10px;white-space:pre-wrap;word-break:break-word;font:inherit;min-height:1.55em}
.term .pr{color:#6fd3a5}.term .cm{color:#8b93a1}.term .ok{color:#6fd3a5}
.term .cur{display:inline-block;width:7px;height:13px;background:#d7dbe2;vertical-align:-2px;animation:bl 1s steps(1) infinite}
.reply{position:absolute;z-index:4;max-width:92vw;background:var(--panel);color:var(--ink);border:1px solid var(--muted);font-size:15px;line-height:1;padding:7px 12px;border-radius:2px 13px 13px 13px;white-space:nowrap;opacity:0;pointer-events:none;transform-origin:left top;box-shadow:0 2px 6px rgba(0,0,0,.10)}
.row.nudge .area{padding-top:44px;padding-bottom:44px}
.curse.soft{top:-17px;font-size:12px;border-radius:10px 10px 10px 2px;background:var(--panel);color:var(--ink);border:1px solid var(--muted);font-family:var(--display);font-weight:400;padding:4px 9px;box-shadow:0 2px 6px rgba(0,0,0,.10)}
.row.nudge .tag{color:var(--owner);font-weight:500}
.row.nudge .note b{color:var(--owner)}
.row.nudge .bub{border-style:dashed}
.row.stop{background:color-mix(in srgb,var(--bad) 7%,var(--panel))}
.row.stop .tag{color:var(--bad);font-weight:500}
.row.stop .note b{color:var(--bad)}
.row.stop.active{background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.gcard h3{cursor:pointer}
.bub .av{width:28px;height:28px;transition:background-color .45s}.bub .av svg{width:16px;height:16px}
.bub .tx{display:flex;flex-direction:column;line-height:1.2}
.bub .tx small{font-size:11px;color:var(--c);font-weight:600;transition:color .45s}
.bub .tx b{font-size:13.5px;font-weight:500}
.bub.file .tx b{font-family:var(--mono);font-size:12.5px}
.bub .st{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--c);margin-left:2px;flex:none}
.bub.done .st{background:var(--ok);border-color:var(--ok)}
.row.pre .from,.row.pre .arr{opacity:0}
/* gate */
.gcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;padding:20px 22px 22px;background:var(--panel);transition:opacity .4s}
.gcard.idle{opacity:.3}
.gcard h3{font-size:15px;font-weight:600;margin:0 0 8px;color:var(--owner)}
.gcard ul{margin:0;padding:0;list-style:none;font-size:13px}
.gcard li{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.gcard li code{font-family:var(--mono);font-size:12px;min-width:118px;color:var(--repo)}
.gcard li span{color:var(--muted)}
.cbox{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:12px}
.cbox .who{font-size:12px;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.cbox .who i{width:20px;height:20px;border-radius:50%;background:var(--owner);color:var(--panel);font-style:normal;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.field{font-family:var(--mono);font-size:14px;min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);display:flex;align-items:center}
.field.focus{border-color:var(--owner);box-shadow:0 0 0 3px var(--owner-bg)}
.caret{display:inline-block;width:1.5px;height:17px;background:var(--ink);margin-left:1px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.send{margin-top:8px;display:flex;justify-content:flex-end}
.send span{font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:6px;background:var(--line);color:var(--muted);transition:all .25s}
.send span.go{background:var(--owner);color:var(--panel)}
.after{list-style:none;margin:12px 0 0;padding:0;font-size:13px}
.after li{display:flex;gap:9px;align-items:baseline;padding:4px 0;opacity:0;transform:translateY(4px);transition:all .4s}
.after li.show{opacity:1;transform:none}
.after li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;position:relative;top:-1px}
.after code{font-family:var(--mono);font-size:12px}
.stub{padding:18px 22px 22px;color:var(--muted);font-size:13.5px}
.stub ol{margin:8px 0 0;padding-left:20px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);padding:12px 22px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1.5px solid var(--accent)}
@media (max-width:1100px){
  .wrap{padding:14px 12px 60px}
  .layout{grid-template-columns:minmax(0,1fr);gap:12px}
  .railwrap{position:sticky;top:0;z-index:7;display:flex;align-items:center;gap:8px;background:var(--bg);margin:0 -12px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .burger{display:inline-flex}
  .rail{flex:1;min-width:0;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:0;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail li{padding:0;flex:none} .rail li::before,.rail li::after{display:none}
  .rail button{padding:5px 11px;border:1px solid var(--line);border-radius:14px;font-size:12.5px;white-space:nowrap;width:auto;background:var(--panel)}
  .rail li em,.rail li small{display:none}
  .rail li.on button{border-color:var(--accent);background:var(--tint)}
  .rail li.gate.on button{border-color:var(--owner);background:var(--owner-bg)}
  .rail li.done button{color:var(--ink)}
  .scene{scroll-margin-top:56px;margin-bottom:16px}
  .ctl{position:absolute;left:0;right:0;top:100%;z-index:6;display:none;grid-template-columns:1fr 1fr;gap:8px;padding:12px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 8px 18px rgba(0,0,0,.14)}
  .ctl.open{display:grid}
  .ctl button{text-align:center}
}
@media (max-width:860px){
  h1{font-size:21px} header{margin-bottom:12px}
  .inner{min-width:0}
  .shead{padding:14px 14px 12px;gap:8px 12px} .shead h2{font-size:17px}
  .roles{padding:10px 14px}
  .grid{grid-template-columns:58px minmax(0,1fr)}
  .row .tag{padding:14px 0 0 8px;font-size:10.5px}
  .row .area{padding:22px 12px 8px 4px}
  .row .note{grid-column:1 / -1;border-left:0;padding:0 14px 12px 62px}
  .hop{flex-direction:column;align-items:flex-start;gap:4px;min-height:0}
  .arr{display:none}
  .bub{white-space:normal;max-width:100%}
  .gcard{grid-template-columns:minmax(0,1fr);padding:16px 14px}
  .gcard li code{min-width:0;flex:none;max-width:45%}
  .field{font-size:13px}
  .nogate{padding:12px 14px}
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){.bub,.from,.arr,.row,.after li{transition:none}.caret{animation:none}}

.scene{scroll-margin-top:12px}
.toplegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);margin:0 0 16px}
.toplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1.5px solid var(--accent)}
.nogate{padding:14px 22px;font-size:13px;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin:0 0 18px;padding:16px 20px;border:1.5px solid var(--accent);border-radius:10px;background:var(--tint)}
.cta span{font-size:16px;font-weight:500}
.cta button{font-size:15px;padding:9px 18px}
.cta.hide{display:none}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 18px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.sum b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;color:var(--muted)}
.back{position:fixed;right:16px;bottom:16px;z-index:20;display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:22px;border:0;background:var(--accent);color:var(--panel);font-weight:500;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer}
.back.show{display:inline-flex}
.back:hover{border:0;filter:brightness(1.08)}
.back i{width:8px;height:8px;border-radius:50%;background:var(--panel);animation:bl 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.back i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="h-title"></h1>
      <p class="about" id="h-about"></p>
      <p class="lead" id="h-lead"></p>
    </div>
  </header>
  <div class="layout">
    <div class="railwrap" id="railwrap"><button id="burger" class="burger" type="button" aria-expanded="false" aria-controls="ctl" aria-label="Управление анимацией">≡</button><ol class="rail" id="rail"></ol></div>
    <div>
      <div class="toplegend"><span><i></i>задача в работе</span><span><i style="background:var(--ok);border-color:var(--ok)"></i>задача done или файл в репозитории</span><span>Слева от плашки видно, от кого пришла задача</span></div>
      <div class="sum" id="sum"></div>
      <div class="cta" id="cta"><span>Нажми кнопку, чтобы посмотреть, как всё работает</span><button class="primary" id="cta-btn" type="button">Смотреть анимацию</button></div>
      <div id="scenes"></div>
    </div>
    <aside class="ctl" id="ctl" aria-label="Управление анимацией">
      <button class="primary" id="play" type="button">Пуск</button>
      <button id="restart" type="button">Сначала</button>
      <button id="follow" type="button" aria-pressed="true">Следить за шагом: да</button>
      <button id="speed" type="button" aria-label="Скорость анимации">Скорость: ×2</button>
      <button id="theme" type="button">Тема: авто</button>
    </aside>
  </div>
</div>
